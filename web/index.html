<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>better-zentao · 研发协作工作台</title>
    <link rel="stylesheet" href="/portal.css" />
    <link rel="stylesheet" href="/meridian.css" />
    <link rel="stylesheet" href="/meridian-shell.css" />
    <link rel="stylesheet" href="/workbench-page.css" />
    <link rel="stylesheet" href="/daily-pages.css" />
    <link rel="stylesheet" href="/management-pages.css" />
    <link rel="stylesheet" href="/skeleton.css" />
    <link rel="stylesheet" href="/ai-copilot.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <div id="startup" class="startup" role="status" aria-label="本机会话">
      <div class="login-card sk-startup sk-delayed" aria-hidden="true">
        <div class="login-panel">
          <strong class="bzt-brand">better-zentao</strong>
          <div class="sk-lines">
            <span class="sk-block sk-title"></span>
            <span class="sk-block sk-field"></span>
            <span class="sk-block sk-field"></span>
            <span class="sk-block sk-button"></span>
          </div>
        </div>
      </div>
    </div>
    <noscript>请启用 JavaScript 后使用禅道工作台。</noscript>

    <main id="login-page" class="login-page" hidden>
      <div class="login-card">
        <div class="login-panel">
          <div class="bzt-brand">
            <svg
              width="24"
              height="24"
              viewBox="0 0 28 28"
              fill="none"
              aria-hidden="true"
            >
              <rect
                width="28"
                height="28"
                rx="7"
                fill="currentColor"
                fill-opacity=".08"
              />
              <circle
                cx="14"
                cy="14"
                r="8.25"
                stroke="currentColor"
                stroke-opacity=".26"
                stroke-width="1.4"
              />
              <path
                d="M7.5 19.2C9.8 13.1 14.5 8.8 20.5 8.8"
                stroke="var(--accent)"
                stroke-width="2.3"
                stroke-linecap="round"
              />
              <circle cx="20.5" cy="8.8" r="2.2" fill="var(--accent)" />
              <circle
                cx="9.2"
                cy="18.2"
                r="1.4"
                fill="currentColor"
                fill-opacity=".65"
              /></svg
            ><strong>better-zentao</strong>
          </div>
          <h1 class="page-title">登录禅道</h1>
          <p id="launch-required" class="notice" role="status" hidden>
            请从本机启动器打开工作台，再填写禅道地址并登录。
          </p>
          <form
            id="login-form"
            method="post"
            action="/api/login"
            aria-describedby="login-status"
          >
            <label id="login-instance-field" class="field" hidden>
              <span>禅道实例</span>
              <select id="login-instance" name="instanceId" disabled></select>
            </label>
            <label id="login-base-url-field" class="field" hidden>
              <span>禅道地址</span>
              <input
                id="login-base-url"
                name="baseUrl"
                type="url"
                autocomplete="url"
                placeholder="https://zentao.example.com"
                disabled
              />
            </label>
            <label class="field">
              <span>禅道账号</span>
              <input
                id="login-account"
                name="account"
                type="text"
                autocomplete="username"
                required
              />
            </label>
            <label class="field">
              <span>禅道密码</span>
              <input
                id="login-password"
                name="password"
                type="password"
                autocomplete="current-password"
                required
              />
            </label>
            <button id="login-button" class="btn btn-primary" type="submit">
              登录
            </button>
          </form>
          <p id="login-status" class="login-status" role="status"></p>
        </div>
      </div>
    </main>

    <div id="portal-shell" class="bzt-app" hidden>
      <a class="skip-link" href="#work-area">跳到工作区</a>
      <header class="bzt-topbar">
        <div class="bzt-brand">
          <svg
            width="24"
            height="24"
            viewBox="0 0 28 28"
            fill="none"
            aria-hidden="true"
          >
            <rect
              width="28"
              height="28"
              rx="7"
              fill="currentColor"
              fill-opacity=".08"
            />
            <circle
              cx="14"
              cy="14"
              r="8.25"
              stroke="currentColor"
              stroke-opacity=".26"
              stroke-width="1.4"
            />
            <path
              d="M7.5 19.2C9.8 13.1 14.5 8.8 20.5 8.8"
              stroke="var(--accent)"
              stroke-width="2.3"
              stroke-linecap="round"
            />
            <circle cx="20.5" cy="8.8" r="2.2" fill="var(--accent)" />
            <circle
              cx="9.2"
              cy="18.2"
              r="1.4"
              fill="currentColor"
              fill-opacity=".65"
            />
          </svg>
          <div class="bzt-brand-text">
            <div class="bzt-brand-title">
              <span>better-zentao</span>
            </div>
            <div class="bzt-brand-sub" id="brand-sub">研发协作工作台</div>
          </div>
        </div>
        <nav
          id="role-tabs"
          class="role-switcher"
          aria-label="当前账号的角色视角"
        ></nav>
        <div class="bzt-topbar-actions">
          <div
            id="ai-view-switch"
            class="ai-view-switch"
            role="group"
            aria-label="工作台主视图切换"
            hidden
          >
            <button
              type="button"
              class="ai-view-tab is-active"
              data-ai-view="human"
              aria-pressed="true"
            >
              人工工作台
            </button>
            <button
              type="button"
              class="ai-view-tab"
              data-ai-view="ai"
              aria-pressed="false"
            >
              AI 协作
            </button>
          </div>
          <button
            type="button"
            id="ai-assistant-toggle"
            class="btn-secondary btn-sm"
            hidden
          >
            AI 助手
          </button>
          <div class="toolbar-data-group" id="toolbar-data-group">
            <div id="report-period" class="report-period" hidden>
              <label for="report-month">工作月份</label>
              <input type="month" id="report-month" class="bzt-input" />
              <button
                type="button"
                id="report-month-reset"
                class="btn-secondary btn-sm"
                hidden
              >
                本月
              </button>
            </div>
            <button
              type="button"
              id="sync-data"
              class="btn-secondary btn-sm"
              hidden
            >
              同步本页
            </button>
            <span
              id="data-update"
              class="data-update"
              role="status"
              hidden
            ></span>
          </div>
          <button
            type="button"
            id="theme-button"
            class="icon-btn-subtle"
            aria-label="切换深浅主题"
            title="切换深浅主题 (T)"
          ></button>
          <button
            type="button"
            id="reset-view"
            class="icon-btn-subtle"
            aria-label="重置界面偏好"
            title="恢复当前职责默认界面"
          ></button>
          <div class="account-menu-wrap" id="account-menu-wrap">
            <button
              type="button"
              id="account-start"
              class="account-trigger"
              aria-haspopup="menu"
              aria-expanded="false"
              aria-controls="account-popover"
              hidden
            >
              <span
                class="account-avatar"
                id="account-avatar"
                aria-hidden="true"
              ></span>
              <span class="account-trigger-name" id="account-trigger-name"
                >我的账号</span
              >
            </button>
            <div
              id="account-popover"
              class="account-popover"
              role="menu"
              aria-label="账号与系统菜单"
              hidden
            >
              <div class="account-popover-head">
                <strong id="session-account"></strong>
                <span
                  id="account-role-meta"
                  class="account-popover-meta"
                ></span>
                <p id="role-focus" class="account-popover-focus"></p>
                <span id="as-of" class="mono account-popover-asof"></span>
              </div>
              <div class="account-popover-items">
                <button
                  id="ai-settings-button"
                  class="account-popover-item"
                  type="button"
                  role="menuitem"
                  hidden
                >
                  个人 AI 设置
                </button>
                <button
                  id="role-settings-button"
                  class="account-popover-item"
                  type="button"
                  role="menuitem"
                >
                  我的职责
                </button>
                <button
                  id="about-button"
                  class="account-popover-item"
                  type="button"
                  role="menuitem"
                >
                  关于与系统信息
                </button>
                <div class="account-popover-divider" role="separator"></div>
                <button
                  id="logout-button"
                  class="account-popover-item is-danger"
                  type="button"
                  role="menuitem"
                >
                  退出登录
                </button>
              </div>
            </div>
          </div>
        </div>
      </header>
      <div class="bzt-body">
        <aside id="sidebar" class="bzt-sidebar">
          <div class="sidebar-top-row">
            <button
              type="button"
              class="quick-search-pill"
              id="command-button"
              aria-label="快速检索 / 命令"
              title="全局命令与快速检索 (⌘K)"
            >
              <span class="quick-search-text">快速检索 / 命令</span
              ><kbd>⌘K</kbd>
            </button>
            <button
              type="button"
              class="icon-btn-subtle"
              id="collapse-button"
              aria-label="收起导航栏"
              title="收起导航栏"
            ></button>
          </div>
          <div class="sidebar-scroll">
            <div class="nav-group-label" id="nav-heading">工作导航</div>
            <nav id="role-nav" aria-labelledby="nav-heading"></nav>
            <div id="fb-perm-note" class="sidebar-perm-note" hidden>
              已按业务反馈者权限隐藏内部研发与管理菜单
            </div>
          </div>
          <div class="sidebar-footer">
            <span class="sidebar-footer-note">权限按角色与禅道账号收口</span
            ><button
              type="button"
              class="icon-btn-subtle"
              id="key-guide"
              aria-label="键盘快捷键"
              title="键盘快捷键 (?)"
            ></button>
          </div>
        </aside>
        <main id="work-area" class="bzt-main" tabindex="-1">
          <p id="session-status" class="notice" role="status" hidden></p>
          <div id="workspace"></div>
          <div id="ai-workspace-container" hidden></div>
        </main>
        <aside
          id="ai-copilot-drawer"
          class="ai-copilot-drawer"
          aria-label="原位 AI 助手"
          hidden
        >
          <div class="ai-copilot-head">
            <div>
              <strong>AI 助手</strong>
              <span id="ai-copilot-status" class="bzt-badge"></span>
            </div>
            <button
              type="button"
              id="ai-copilot-close"
              class="btn-secondary btn-sm"
            >
              收起
            </button>
          </div>
          <div id="ai-copilot-body" class="ai-copilot-body"></div>
        </aside>
      </div>
      <dialog
        id="about-dialog"
        class="portal-dialog write-modal"
        aria-label="关于与系统信息"
      >
        <div class="modal-head modal-header">
          <strong>关于 better-zentao</strong
          ><button
            class="icon-btn-subtle"
            id="about-close"
            type="button"
            aria-label="关闭"
          ></button>
        </div>
        <div id="about-body" class="modal-body"></div>
      </dialog>
      <dialog
        id="ai-settings-dialog"
        class="portal-dialog write-modal"
        aria-label="个人 AI 网关设置"
      >
        <div class="modal-head modal-header">
          <strong>个人企业大模型网关设置</strong
          ><button
            class="btn-secondary btn-sm"
            id="ai-settings-close"
            type="button"
          >
            关闭
          </button>
        </div>
        <div id="ai-settings-body" class="modal-body"></div>
      </dialog>
    </div>
  </body>
</html>
