# better-zentao Server 1.0 受控内网 HTTPS 反向代理示例
# 请将 server_name 替换为与 server.json 中 externalOrigin 一致的内网域名，
# 并将反代容器/宿主机 IP 加入 server.json 的 trustedProxies。

server {
    listen 443 ssl http2;
    server_name bzt.internal.example;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 256k;

    location / {
        proxy_pass http://bzt-server:17330;
        proxy_http_version 1.1;

        # 强制覆盖客户端传入的 Host 与 X-Forwarded-*，防止伪造
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;

        proxy_read_timeout 35s;
        proxy_connect_timeout 10s;
    }
}
