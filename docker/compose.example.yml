# better-zentao Server 1.0 受控内网单进程部署示例（候选交付）
# 注意：
# 1. Server 1.0 限定单进程单副本 + 本地持久化卷（禁止跨主机 NFS/SMB 共享 SQLite）。
# 2. 首次部署默认 readOnly: true，隔离验证后再由管理员显式开启写入。
# 3. 在 Compose 双容器模式下，config-runtime/server.json 中 host 应设为 "0.0.0.0"（仅暴露于 bzt_internal 内部网，不映射宿主机端口），
#    且 trustedProxies 须包含 reverse-proxy 容器在 bzt_internal 网络中的地址。
# 4. 切勿将包含真实密码、Token 或内网凭据的文件提交到仓库。

services:
  bzt-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      # 管理员维护的 server.json 与每实例 team.<id>.json（只读挂载）
      - ./config-runtime:/etc/bzt:ro
      # 本地持久化卷（仅限本机磁盘，勿用 NFS/SMB）
      - bzt_server_data:/var/lib/bzt
    environment:
      BZT_LOG_LEVEL: info
    networks:
      - bzt_internal

  reverse-proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - bzt-server
    ports:
      - "443:443"
    volumes:
      - ./nginx.example.conf:/etc/nginx/conf.d/default.conf:ro
      # 替换为内网受信任 TLS 证书与私钥（勿入库）
      - ./certs:/etc/nginx/certs:ro
    networks:
      - bzt_internal

volumes:
  bzt_server_data:

networks:
  bzt_internal:
    driver: bridge
